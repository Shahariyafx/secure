
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#f4f9ff">
    <meta name="description" content="TEENSECUREBD Private Database Access">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="secure-container">

        <div class="secure-card">

            <div class="database-label">
                DATABASE
            </div>

            <div class="secure-icon">
                🪪
            </div>

            <h1>TEENSECUERSBD</h1>

            <div class="input-area">
                <label for="accessKey">ACCESS KEY</label>

                <input
                    type="password"
                    id="accessKey"
                    placeholder="Enter your security key"
                    autocomplete="off"
                >
            </div>

            <p id="errorMessage" class="error-message">
                Invalid access key. Its Seems Youre Trying
                To Hack Or Do Something?,Try Again
            </p>

            <button id="continueBtn" type="button">
                <span>CONTINUE</span>
            </button>

            <div class="security-status">
                <span class="status-dot"></span>
                SYSTEM PROTECTED
            </div>

        </div>

        <footer>
            TEENSECUREBD DATABASE SYSTEM

    </main>
