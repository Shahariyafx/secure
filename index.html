
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#07152d">
    <meta name="description" content="TEENSECUREBD Private Database Access">

    <title>TEENSECUERSBD | Shahariya</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lobster&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css?v=20261110">

</head>
<body>

    <!-- ANIMATED NIGHT CITY -->

    <div class="city-scene" aria-hidden="true">

        <div class="night-sky"></div>

        <div class="stars stars-one"></div>
        <div class="stars stars-two"></div>
        <div class="stars stars-three"></div>

        <div class="moon">
            <div class="moon-glow"></div>
        </div>

        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>
        <div class="cloud cloud-three"></div>

        <!-- Distant buildings -->

        <div class="city-layer city-back">
            <div class="building b1"></div>
            <div class="building b2"></div>
            <div class="building b3"></div>
            <div class="building b4"></div>
            <div class="building b5"></div>
            <div class="building b6"></div>
            <div class="building b7"></div>
            <div class="building b8"></div>
        </div>

        <!-- Middle buildings -->

        <div class="city-layer city-middle">
            <div class="building b9"></div>
            <div class="building b10"></div>
            <div class="building b11"></div>
            <div class="building b12"></div>
            <div class="building b13"></div>
            <div class="building b14"></div>
            <div class="building b15"></div>
        </div>

        <!-- Front buildings -->

        <div class="city-layer city-front">
            <div class="building b16"></div>
            <div class="building b17"></div>
            <div class="building b18"></div>
            <div class="building b19"></div>
            <div class="building b20"></div>
        </div>

        <div class="city-horizon"></div>

        <div class="road">
            <div class="road-lights"></div>
        </div>

        <div class="city-vignette"></div>

    </div>

    <!-- MAIN ACCESS PAGE -->

    <main class="secure-container">

        <div class="secure-card">

            <div class="database-label">
                DATABASE
            </div>

            <div class="secure-icon">
                🪪
            </div>

            <h1>TEENSECUERSBD</h1>

            <p class="subtitle">
                Private Database Access
            </p>

            <div class="input-area">

                <label for="accessKey">
                    ACCESS KEY
                </label>

                <input
                    type="password"
                    id="accessKey"
                    placeholder="Enter your security key"
                    autocomplete="off"
                >

            </div>

            <p id="errorMessage" class="error-message">
                Invalid access key. Its Seems Youre Trying
                To Hack Or Do Something?,Try Again
            </p>

            <button id="continueBtn" type="button">
                <span>CONTINUE</span>
            </button>

            <div class="security-status">
                <span class="status-dot"></span>
                SYSTEM PROTECTED
            </div>

        </div>

        <footer>
            TEENSECUREBD DATABASE SYSTEM
        </footer>

    </main>

    <script src="./script.js"></script>

</body>
</html>
